name: NAP Portable Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nap-portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply maintained Nexus overlay
        shell: bash
        run: ./scripts/apply-lancer-nexus-patches.sh
      - name: Test NAP library and VFS
        shell: bash
        run: dotnet test src/Nexus.Assets.Tests/Nexus.Assets.Tests.csproj --configuration Release -p:UseSharedCompilation=false --logger trx
